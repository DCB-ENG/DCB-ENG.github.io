name: Unblock stuck Pages deployment
on:
  push:
    paths:
      - '.github/workflows/unblock-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  cancel-stuck-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/$REPO/pages/deployments/16834c2fd055855e63c35d98d624174a6a8e4fcc/cancel"
