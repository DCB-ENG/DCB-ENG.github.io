name: Check Roll Cage Generator
on:
  push:
    paths:
      - 'roll-cage/index.html'
      - 'roll-cage/ui-workspace.js'
      - 'roll-cage/preview-3d.js'
      - 'roll-cage/preview-collisions.js'
      - 'roll-cage/project-state.js'
      - 'tests/roll-cage-preflight-project.test.cjs'
      - 'tests/roll-cage-browser-smoke.cjs'
      - 'tests/roll-cage-3d-preview.test.cjs'
      - 'roll-cage/ui-workspace.css'
      - 'tests/roll-cage-ui-workspace.test.cjs'
      - 'steel-nesting/index.html'
      - 'steel-nesting/roll-cage-transfer.js'
      - 'tests/roll-cage-smoke.cjs'
      - 'tests/roll-cage-nesting-transfer.test.cjs'
      - '.github/workflows/check-roll-cage.yml'
  pull_request:
    paths:
      - 'roll-cage/index.html'
      - 'roll-cage/ui-workspace.js'
      - 'roll-cage/preview-3d.js'
      - 'roll-cage/preview-collisions.js'
      - 'roll-cage/project-state.js'
      - 'tests/roll-cage-preflight-project.test.cjs'
      - 'tests/roll-cage-browser-smoke.cjs'
      - 'tests/roll-cage-3d-preview.test.cjs'
      - 'roll-cage/ui-workspace.css'
      - 'tests/roll-cage-ui-workspace.test.cjs'
      - 'steel-nesting/index.html'
      - 'steel-nesting/roll-cage-transfer.js'
      - 'tests/roll-cage-smoke.cjs'
      - 'tests/roll-cage-nesting-transfer.test.cjs'
      - '.github/workflows/check-roll-cage.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate roll cage calculator script and geometry
        run: node tests/roll-cage-smoke.cjs
      - name: Validate roll cage to steel nesting import
        run: node tests/roll-cage-nesting-transfer.test.cjs
      - name: Validate four-tab roll cage workspace
        run: node tests/roll-cage-ui-workspace.test.cjs
      - name: Validate interactive WebGL 3D cage preview
        run: node tests/roll-cage-3d-preview.test.cjs
      - name: Validate fabrication preflight, project files and collisions
        run: node tests/roll-cage-preflight-project.test.cjs
  browser:
    needs: smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium automation dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Validate desktop and mobile Chrome interactions
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cage-http.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/roll-cage/; then break; fi
            sleep 1
          done
          node tests/roll-cage-browser-smoke.cjs
